name: Web Container

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.web.yml"
      - "requirements-web.txt"
      - "requirements-web.lock.txt"
      - "package.json"
      - "package-lock.json"
      - "web/**"
      - "src/resolver.py"
      - ".github/workflows/web-container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.web.yml"
      - "requirements-web.txt"
      - "requirements-web.lock.txt"
      - "web/**"
      - "src/resolver.py"
      - ".github/workflows/web-container.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate Compose
        run: docker compose -f compose.web.yml config > /tmp/compose.rendered.yml

      - name: Build web image
        run: docker build --tag mediaflow-web:test .

      - name: Scan final image vulnerabilities
        run: |
          docker save mediaflow-web:test -o /tmp/mediaflow-web.tar
          docker run --rm \
            --volume /tmp/mediaflow-web.tar:/scan/image.tar:ro \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/image.tar \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --no-progress

      - name: Scan Docker configuration
        run: |
          docker run --rm \
            --volume "$PWD:/src:ro" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config /src \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --no-progress

      - name: Start container
        run: |
          docker run -d \
            --name mediaflow-web \
            --publish 127.0.0.1:8000:8000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --init \
            --pids-limit 128 \
            --ulimit nofile=1024:2048 \
            --memory 1g \
            --cpus 2 \
            --tmpfs /tmp:size=256m,mode=1777,noexec,nosuid,nodev \
            mediaflow-web:test

      - name: Smoke test
        run: |
          set -e
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs mediaflow-web
              exit 1
            fi
            sleep 1
          done

          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "MediaFlow"
          docker exec mediaflow-web sh -c "test -s /app/web/static/app.js && find /app/web/static/chunks -type f -name '*.js' -print -quit | grep -q ."
          docker exec mediaflow-web deno --version
          docker exec mediaflow-web ffmpeg -version | head -n 1

      - name: Container logs on failure
        if: failure()
        run: docker logs mediaflow-web || true

      - name: Cleanup
        if: always()
        run: docker rm -f mediaflow-web || true
