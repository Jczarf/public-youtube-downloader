name: Security Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Instalar scanner dedicado
        run: python -m pip install "detect-secrets==1.5.0"
      - name: Scanner dedicado — árvore e histórico alcançável
        run: python scripts/detect_secrets_scan.py
      - name: Checagem adicional específica do projeto
        run: python scripts/check_public_safety.py
