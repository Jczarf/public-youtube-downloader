name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bibliotecas Qt headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Valida scripts shell
        run: bash -n install.sh run.sh
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q src main.py
      - name: Tests
        run: python -m pytest -q
      - name: GUI smoke test
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from src.app import YouTubeDownloaderWindow
          app = QApplication([])
          window = YouTubeDownloaderWindow()
          assert window.windowTitle() == "YouTube Downloader"
          window.close()
          PY
