name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Bibliotecas Qt headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg
      - name: Valida scripts shell
        run: bash -n install.sh run.sh run-web.sh
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-web.txt pytest
          python -m pip check
      - name: Build web frontend
        run: |
          npm install --no-package-lock --no-fund --no-audit
          npm run build:web
          test -s web/static/app.js
          find web/static/chunks -type f -name '*.js' -print -quit | grep -q .
      - name: Compile
        run: python -m compileall -q src web main.py
      - name: Tests
        run: python -m pytest -q
      - name: Web API smoke test
        run: |
          python - <<'PY'
          from web.app import app
          assert app.title == "YouTube Downloader Web API"
          assert app.version == "0.3.0"
          PY
      - name: GUI smoke test
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from src.app import YouTubeDownloaderWindow
          app = QApplication([])
          window = YouTubeDownloaderWindow()
          assert window.windowTitle() == "YouTube Downloader"
          window.close()
          PY
