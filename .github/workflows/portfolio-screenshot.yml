name: Portfolio Screenshot

on:
  push:
    paths:
      - '.github/workflows/portfolio-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Renderizar interface Qt real
        run: |
          mkdir -p assets
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from src.app import YouTubeDownloaderWindow

          app = QApplication([])
          window = YouTubeDownloaderWindow()
          window.resize(1440, 900)
          window.show()
          app.processEvents()
          pixmap = window.grab()
          if not pixmap.save('assets/screenshot-real.png'):
              raise SystemExit('Falha ao salvar screenshot Qt')
          window.close()
          PY
      - name: Validar artefato
        run: test -s assets/screenshot-real.png
      - name: Registrar screenshot no portfólio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screenshot-real.png
          if git diff --cached --quiet; then
            echo 'Screenshot já está atualizado.'
          else
            git commit -m 'docs: adiciona screenshot real da interface [skip ci]'
            git push
          fi
