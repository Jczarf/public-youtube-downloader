services:
  mediaflow:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WEB_FFMPEG_CONCURRENCY: "${WEB_FFMPEG_CONCURRENCY:-2}"
      WEB_FFMPEG_TIMEOUT_SECONDS: "${WEB_FFMPEG_TIMEOUT_SECONDS:-3600}"
      WEB_RESOLVE_CONCURRENCY: "${WEB_RESOLVE_CONCURRENCY:-4}"
      WEB_RELAY_CONCURRENCY: "${WEB_RELAY_CONCURRENCY:-8}"
      WEB_MAX_DURATION_SECONDS: "${WEB_MAX_DURATION_SECONDS:-7200}"
      WEB_MAX_MEDIA_BYTES: "${WEB_MAX_MEDIA_BYTES:-1073741824}"
      WEB_MAX_SESSIONS: "${WEB_MAX_SESSIONS:-256}"
      WEB_MAX_CANDIDATES_PER_SESSION: "${WEB_MAX_CANDIDATES_PER_SESSION:-64}"
      WEB_ACTIVE_RESOLVE_PER_CLIENT: "${WEB_ACTIVE_RESOLVE_PER_CLIENT:-1}"
      WEB_ACTIVE_PROCESS_PER_CLIENT: "${WEB_ACTIVE_PROCESS_PER_CLIENT:-1}"
      WEB_ACTIVE_RELAY_PER_CLIENT: "${WEB_ACTIVE_RELAY_PER_CLIENT:-6}"
      WEB_RATE_RESOLVE_PER_MINUTE: "${WEB_RATE_RESOLVE_PER_MINUTE:-8}"
      WEB_RATE_PLAN_PER_MINUTE: "${WEB_RATE_PLAN_PER_MINUTE:-30}"
      WEB_RATE_PROCESS_PER_MINUTE: "${WEB_RATE_PROCESS_PER_MINUTE:-6}"
      WEB_RATE_RELAY_PER_MINUTE: "${WEB_RATE_RELAY_PER_MINUTE:-180}"
      WEB_RATE_DIRECT_PER_MINUTE: "${WEB_RATE_DIRECT_PER_MINUTE:-60}"
      WEB_ALLOWED_HOSTS: "${WEB_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      WEB_TRUSTED_PROXY_CIDRS: "${WEB_TRUSTED_PROXY_CIDRS:-}"
      WEB_ENABLE_DOCS: "${WEB_ENABLE_DOCS:-0}"
      WEB_ENABLE_HSTS: "${WEB_ENABLE_HSTS:-0}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:size=256m,mode=1777
